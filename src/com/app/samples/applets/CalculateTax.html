<!-- CalculateTax.html file that embeds CalculateTax.class -->
<!-- This page sends name and salary to Applet -->
<html>
<h1>INCOME TAX CALCULATOR</h1>
<body>

<!-- param tag takes name and its value as strings -->
<applet code="com.app.samples.applets.CalculateTax" width="300" height="300">
	<param name = "username" value = "Abid">
	<param name = "salary" value = "15000.50">
</applet>

</body>
</html>
